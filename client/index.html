<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0c0e" />

    <title>HealthHubPro — Activity, workouts and challenges</title>
    <meta
      name="description"
      content="Track steps, sleep, hydration and workouts, compete in challenges, and get rule-based insights from your own activity data."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="HealthHubPro" />
    <meta
      property="og:description"
      content="Track steps, sleep, hydration and workouts, compete in challenges, and get rule-based insights from your own activity data."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      />
    </noscript>

    <script>
      // Set the theme before first paint so a light-mode user never sees a
      // dark flash. Wrapped because storage throws in some privacy modes.
      (function () {
        try {
          var t = localStorage.getItem('hhp-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.dataset.theme = t;
            document.documentElement.style.colorScheme = t;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
