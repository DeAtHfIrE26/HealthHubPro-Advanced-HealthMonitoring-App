<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="HealthHubPro Showcase — components, hooks and parsers, extracted and standalone">
  <title>HealthHubPro Showcase</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f9fb"/>
      <stop offset="55%" stop-color="#eef2f6"/>
      <stop offset="100%" stop-color="#eef6e6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c741b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5c741b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5c741b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b8720"/>
      <stop offset="100%" stop-color="#405213"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <style>
      /* CSS keyframes inside the SVG: GitHub strips JS but renders this when
         the file is embedded with an img tag. */
      .grid    { animation: drift 24s linear infinite; }
      .trace   { stroke-dasharray: 1750; stroke-dashoffset: 1750; animation: draw 5s cubic-bezier(.45,0,.2,1) infinite; }
      .pulse   { animation: beat 5s ease-in-out infinite; transform-origin: center; }
      .sweep   { animation: sweep 5s linear infinite; }
      .fade-1  { opacity: 0; animation: rise .8s ease-out .15s forwards; }
      .fade-2  { opacity: 0; animation: rise .8s ease-out .40s forwards; }
      .fade-3  { opacity: 0; animation: rise .8s ease-out .65s forwards; }
      .chip    { opacity: 0; animation: rise .7s ease-out forwards; }
      .chip-1  { animation-delay: .85s; }
      .chip-2  { animation-delay: .98s; }
      .chip-3  { animation-delay: 1.11s; }
      .chip-4  { animation-delay: 1.24s; }
      .bar     { transform-origin: 0 300px; animation: grow 1.1s cubic-bezier(.22,1,.36,1) forwards; opacity: .9; }

      @keyframes draw  { 0% { stroke-dashoffset: 1750; } 55% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: .25; } }
      @keyframes beat  { 0%, 42%, 100% { transform: scale(1); } 47% { transform: scale(1.5); } 53% { transform: scale(1); } }
      @keyframes sweep { 0% { transform: translateX(-340px); } 100% { transform: translateX(1240px); } }
      @keyframes drift { 0% { transform: translateX(0); } 100% { transform: translateX(-60px); } }
      @keyframes rise  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes grow  { from { transform: scaleY(0); } to { transform: scaleY(1); } }

      /* Anyone who asks for less motion gets the finished frame, not a loop. */
      @media (prefers-reduced-motion: reduce) {
        .grid, .trace, .pulse, .sweep, .fade-1, .fade-2, .fade-3, .chip, .bar { animation: none; }
        .trace  { stroke-dashoffset: 0; }
        .fade-1, .fade-2, .fade-3, .chip { opacity: 1; }
        .bar    { transform: scaleY(1); }
        .sweep  { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- Graph paper, drifting slowly. -->
  <g class="grid" opacity="0.5">
    <g stroke="#dde3ea" stroke-width="1">
      <path d="M0 60h1320M0 120h1320M0 180h1320M0 240h1320M0 300h1320"/>
      <path d="M60 0v360M120 0v360M180 0v360M240 0v360M300 0v360M360 0v360M420 0v360M480 0v360M540 0v360M600 0v360M660 0v360M720 0v360M780 0v360M840 0v360M900 0v360M960 0v360M1020 0v360M1080 0v360M1140 0v360M1200 0v360M1260 0v360"/>
    </g>
  </g>

  <!-- Bars: the chart this library is built around. -->
  <g fill="#5c741b">
    <rect class="bar" x="792"  y="228" width="26" height="72"  rx="3" style="animation-delay:.70s"/>
    <rect class="bar" x="830"  y="196" width="26" height="104" rx="3" style="animation-delay:.76s"/>
    <rect class="bar" x="868"  y="244" width="26" height="56"  rx="3" style="animation-delay:.82s"/>
    <rect class="bar" x="906"  y="164" width="26" height="136" rx="3" style="animation-delay:.88s" opacity="1"/>
    <rect class="bar" x="944"  y="212" width="26" height="88"  rx="3" style="animation-delay:.94s"/>
    <rect class="bar" x="982"  y="236" width="26" height="64"  rx="3" style="animation-delay:1.00s"/>
    <rect class="bar" x="1020" y="184" width="26" height="116" rx="3" style="animation-delay:1.06s"/>
    <rect class="bar" x="1058" y="220" width="26" height="80"  rx="3" style="animation-delay:1.12s"/>
  </g>
  <path d="M780 300h320" stroke="#c9d2dc" stroke-width="2"/>

  <!-- ECG trace. Drawn twice: a blurred copy underneath for the glow. -->
  <g>
    <path class="trace" filter="url(#soft)" opacity="0.30" fill="none" stroke="#5c741b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
      d="M0 300 H120 l18 0 l14 -4 l16 8 l14 -34 l16 68 l16 -54 l14 16 l18 0 H420 l16 0 l14 -4 l16 8 l14 -34 l16 68 l16 -54 l14 16 l18 0 H700"/>
    <path class="trace" fill="none" stroke="#4d6317" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
      d="M0 300 H120 l18 0 l14 -4 l16 8 l14 -34 l16 68 l16 -54 l14 16 l18 0 H420 l16 0 l14 -4 l16 8 l14 -34 l16 68 l16 -54 l14 16 l18 0 H700"/>
    <circle class="pulse" cx="182" cy="270" r="5" fill="#5c741b"/>
  </g>

  <!-- A highlight that travels the width once per cycle. -->
  <rect class="sweep" x="0" y="0" width="340" height="360" fill="url(#glow)" opacity="0.05"/>

  <!-- Wordmark. -->
  <g font-family="'Space Grotesk','DejaVu Sans',Verdana,sans-serif">
    <text class="fade-1" x="72" y="118" font-size="62" font-weight="700" fill="#121a24" letter-spacing="-1.5">
      HealthHubPro
    </text>
    <text class="fade-2" x="72" y="118" font-size="62" font-weight="700" fill="url(#accentText)" letter-spacing="-1.5" opacity="0">
      <tspan x="72" dy="0" fill="transparent">HealthHubPro</tspan>
    </text>
    <text class="fade-2" x="76" y="158" font-size="26" font-weight="600" fill="url(#accentText)" letter-spacing="5.5">
      S H O W C A S E
    </text>
    <text class="fade-3" x="74" y="196" font-size="19" font-weight="400" fill="#4a5561" font-family="'DejaVu Sans',Verdana,sans-serif">
      Components, hooks and health-data parsers — extracted and standalone
    </text>
  </g>

  <!-- Claim chips, each backed by a number in the README. -->
  <g font-family="'DejaVu Sans',Verdana,sans-serif" font-size="14" font-weight="600">
    <g class="chip chip-1">
      <rect x="72"  y="224" width="152" height="34" rx="17" fill="#5c741b" fill-opacity="0.10" stroke="#5c741b" stroke-opacity="0.40"/>
      <text x="148" y="246" fill="#4d6317" text-anchor="middle">99 kB → 2 kB</text>
    </g>
    <g class="chip chip-2">
      <rect x="236" y="224" width="128" height="34" rx="17" fill="#5c741b" fill-opacity="0.10" stroke="#5c741b" stroke-opacity="0.40"/>
      <text x="300" y="246" fill="#4d6317" text-anchor="middle">82 tests</text>
    </g>
    <g class="chip chip-3">
      <rect x="376" y="224" width="132" height="34" rx="17" fill="#5c741b" fill-opacity="0.10" stroke="#5c741b" stroke-opacity="0.40"/>
      <text x="442" y="246" fill="#4d6317" text-anchor="middle">WCAG AA</text>
    </g>
    <g class="chip chip-4">
      <rect x="520" y="224" width="150" height="34" rx="17" fill="#5c741b" fill-opacity="0.10" stroke="#5c741b" stroke-opacity="0.40"/>
      <text x="595" y="246" fill="#4d6317" text-anchor="middle">Zero deps added</text>
    </g>
  </g>

  <rect x="0" y="356" width="1200" height="4" fill="url(#glow)" opacity="0.5"/>
</svg>
